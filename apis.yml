  description: >-
    JSON REST API exposing Common Sense Media's reviews and ratings catalog. Each review includes recommended
    age, age-rating group (littleKids/kids/tweens/teens), star rating, content grid (educational, message,
    role-model, diversity, violence, sex, language, consumerism, drugs), parents-need-to-know guidance,
    talking points, and product metadata. Clients filter by media type, age range, star range, character
    strengths, topics, genres, and the Common Sense Selection award. Authentication uses a partner-issued
    x-api-key header. The API is GET-only, HTTPS-only, rate-limited to 100 unique requests per minute,
    and content is refreshed at most hourly.
  x-features:
  - x-api-key header authentication
  - GET-only, HTTPS-only access
  - Filter by mediaType (app, book, game, movie, podcast, tv, website, youtube)
  - Age-range and star-range deepObject filters
  - Filter by character strengths, topics, genres
  - Common Sense Selection award filter (csmAward=true)
  - Vocabulary lookup endpoint for filterable fields
  - English and Spanish (en, es) language responses
  - Rate limited to 100 unique requests per minute
  x-use-cases:
  - Embedding age-rated reviews in parenting and family apps
  - Powering smart-TV guides with content advisories
  - Driving content discovery in education platforms
  - Surfacing Common Sense Selection award lists
  - Filtering streaming or library catalogs by recommended age
